name: Python Tests

on:
  push:
    paths:
      - "open-ephys-python-tools/**"
      - "OEPlugins/paradigm-bridge/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "open-ephys-python-tools/**"
      - "OEPlugins/paradigm-bridge/**"
      - ".github/workflows/python-tests.yml"

jobs:
  open-ephys-python-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e open-ephys-python-tools
      - name: Run tests
        run: pytest open-ephys-python-tools/tests -q

  paradigm-bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e OEPlugins/paradigm-bridge
      - name: Run tests
        run: pytest OEPlugins/paradigm-bridge/tests -q
